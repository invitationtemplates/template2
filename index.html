<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pooja &amp; Rahul · Wedding Invitation</title>
    <meta name="description" content="Together with their families, Pooja &amp; Rahul joyfully invite you to celebrate their wedding. SAMPLE CONTENT: replace in src/data/invitation.ts." />
    <meta name="theme-color" content="#0C4952" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Twitter: set VITE_SITE_URL in .env so the preview image resolves on WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pooja &amp; Rahul · Wedding Invitation" />
    <meta property="og:description" content="You are invited to celebrate the wedding of Pooja &amp; Rahul." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts requires the families in alphabetical order. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
